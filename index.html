<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MACHO'S ALPHA | Umpire Pro v5.0</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,900;1,900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
    
    <style>
        body { 
            background-color: #0b0c10;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(6, 182, 212, 0.08), transparent 30%),
                radial-gradient(circle at 85% 30%, rgba(217, 70, 239, 0.08), transparent 30%);
            color: white; 
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent; 
            overscroll-behavior: none; 
            overflow: hidden; 
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .font-digital { font-family: 'Orbitron', sans-serif; }
        
        /* ==========================================
           SISTEMA DE BOTONES 3D SÓLIDOS
           ========================================== */
        .btn-3d {
            position: relative;
            margin-bottom: 4px;
            transition: transform 0.1s ease, box-shadow 0.1s ease, background-color 0.2s;
        }
        .btn-3d:active { 
            transform: translateY(4px) !important; 
        }
        
        /* Botón Apagado / Standby */
        .btn-off { background-color: #1e293b; box-shadow: 0 4px 0 #0f172a; color: #94a3b8; }
        .btn-off:active { box-shadow: 0 0px 0 #0f172a !important; }
        
        /* Botón Jugador 1 (Cyan) */
        .btn-cyan { background-color: #06b6d4; box-shadow: 0 4px 0 #164e63, 0 0 15px rgba(6,182,212, 0.5); color: white; }
        .btn-cyan:active { box-shadow: 0 0px 0 #164e63, 0 0 5px rgba(6,182,212, 0.5) !important; }
        
        /* Botón Jugador 2 (Fuchsia) */
        .btn-fuchsia { background-color: #d946ef; box-shadow: 0 4px 0 #701a75, 0 0 15px rgba(217,70,239, 0.5); color: white; }
        .btn-fuchsia:active { box-shadow: 0 0px 0 #701a75, 0 0 5px rgba(217,70,239, 0.5) !important; }
        
        /* Botón Blanco (Principal) */
        .btn-white { background-color: #f8fafc; box-shadow: 0 4px 0 #94a3b8, 0 0 15px rgba(255,255,255, 0.3); color: #0f172a; }
        .btn-white:active { box-shadow: 0 0px 0 #94a3b8, 0 0 5px rgba(255,255,255, 0.3) !important; }
        
        /* Botón Naranja (Pausa) */
        .btn-orange { background-color: #f97316; box-shadow: 0 4px 0 #9a3412, 0 0 15px rgba(249,115,22, 0.4); color: white; }
        .btn-orange:active { box-shadow: 0 0px 0 #9a3412, 0 0 5px rgba(249,115,22, 0.4) !important; }

        /* Botón Rojo (Apagar) */
        .btn-red { background-color: #e11d48; box-shadow: 0 4px 0 #881337, 0 0 15px rgba(225,29,72, 0.4); color: white; }
        .btn-red:active { box-shadow: 0 0px 0 #881337, 0 0 5px rgba(225,29,72, 0.4) !important; }

        /* ==========================================
           MARCADORES GIGANTES 3D (Pantalla de Juego)
           ========================================== */
        .card-score {
            background-color: #0f172a; /* Slate 900 */
            margin-bottom: 8px;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .card-score:active { transform: translateY(8px); }
        
        .score-p1 { border-top: 2px solid #06b6d4; box-shadow: 0 8px 0 #020617, 0 0 20px rgba(6,182,212,0.15); }
        .score-p1:active { box-shadow: 0 0px 0 #020617, 0 0 10px rgba(6,182,212,0.15) !important; }
        
        .score-p2 { border-top: 2px solid #d946ef; box-shadow: 0 8px 0 #020617, 0 0 20px rgba(217,70,239,0.15); }
        .score-p2:active { box-shadow: 0 0px 0 #020617, 0 0 10px rgba(217,70,239,0.15) !important; }

        /* Nombres arriba del marcador en 3D */
        .name-p1 { background-color: #0891b2; box-shadow: 0 6px 0 #164e63, 0 0 15px rgba(6,182,212,0.4); margin-bottom: 6px; }
        .name-p2 { background-color: #c026d3; box-shadow: 0 6px 0 #701a75, 0 0 15px rgba(217,70,239,0.4); margin-bottom: 6px; }
        
        /* Glass panel genérico para fondos ligeros */
        .glass-dark { background: rgba(15, 17, 26, 0.7); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useMemo, useRef } = React;
        
        const JUGADORES = ["ANDRADE", "ISAI", "VILLEGAS", "ARTURO", "CUTBERTO", "GABRIEL", "LUIS", "ROBIN"];

        function App() {
            const [view, setView] = useState('setup'); 
            
            const [matches, setMatches] = useState(() => {
                const guardado = localStorage.getItem('machos_matches');
                if (guardado) {
                    try { return JSON.parse(guardado); } catch(e) { return []; }
                }
                return [];
            });
            
            const [p1, setP1] = useState(null);
            const [p2, setP2] = useState(null);
            const [mode, setMode] = useState('2-3'); 
            const [score1, setScore1] = useState(0);
            const [score2, setScore2] = useState(0);
            const [sets1, setSets1] = useState(0);
            const [sets2, setSets2] = useState(0);
            const [winner, setWinner] = useState(null);
            const [history, setHistory] = useState([]); 
            const [servingFirst, setServingFirst] = useState(1); 
            const [swapped, setSwapped] = useState(false);
            
            const [matchTime, setMatchTime] = useState(0);
            const [gameTime, setGameTime] = useState(0);
            const [timeoutSeconds, setTimeoutSeconds] = useState(0);
            const [isTimeoutActive, setIsTimeoutActive] = useState(false);
            const [isPaused, setIsPaused] = useState(false);
            const [showResetConfirm, setShowResetConfirm] = useState(false);
            const [isMuted, setIsMuted] = useState(false); 
            
            const [selectedPlayerStats, setSelectedPlayerStats] = useState(null);
            
            const timerRef = useRef(null);
            const stateRef = useRef({});

            useEffect(() => {
                localStorage.setItem('machos_matches', JSON.stringify(matches));
            }, [matches]);

            useEffect(() => {
                if (view === 'match' && !winner && !isPaused && !showResetConfirm) {
                    timerRef.current = setInterval(() => {
                        if (isTimeoutActive) {
                            setTimeoutSeconds(s => { if (s <= 1) { setIsTimeoutActive(false); return 0; } return s - 1; });
                        } else {
                            setMatchTime(t => t + 1);
                            setGameTime(t => t + 1);
                        }
                    }, 1000);
                } else {
                    clearInterval(timerRef.current);
                }
                return () => clearInterval(timerRef.current);
            }, [view, winner, isTimeoutActive, isPaused, showResetConfirm]);

            // ==========================================
            // CONTROL BLUETOOTH / ANILLO
            // ==========================================
            useEffect(() => {
                stateRef.current = { view, isPaused, addPoint, undo, startTimeout, winner, showResetConfirm };
            });

            useEffect(() => {
                const handlePopState = (e) => {
                    const { view, winner, showResetConfirm } = stateRef.current;
                    if (view === 'match' && !winner && !showResetConfirm) {
                        window.history.pushState({ inMatch: true }, ""); 
                    }
                };
                window.addEventListener('popstate', handlePopState);

                const handleKeyDown = (e) => {
                    const { view, isPaused, addPoint, undo, startTimeout, winner, showResetConfirm } = stateRef.current;

                    if (view !== 'match' || winner || showResetConfirm) return;

                    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','PageUp','PageDown','AudioVolumeUp','AudioVolumeDown','BrowserBack'].includes(e.key)) {
                        e.preventDefault(); 
                    }

                    switch(e.key) {
                        case 'ArrowLeft': case 'MediaTrackPrevious': case 'MediaRewind':
                            if (!isPaused) addPoint(1); break;
                        case 'ArrowRight': case 'MediaTrackNext': case 'MediaFastForward':
                            if (!isPaused) addPoint(2); break;
                        case 'MediaPlayPause': case 'Pause': case 'Play': case 'Enter': case ' ':
                            if (!isPaused) undo(); break;
                        case 'ArrowUp': case 'PageUp':
                            if (!isPaused) startTimeout(); break;
                    }
                };
                window.addEventListener('keydown', handleKeyDown);

                return () => {
                    window.removeEventListener('popstate', handlePopState);
                    window.removeEventListener('keydown', handleKeyDown);
                };
            }, []);

            useEffect(() => {
                if (view === 'match' && 'mediaSession' in navigator) {
                    navigator.mediaSession.metadata = new MediaMetadata({ title: 'Torneo Activo', artist: 'Macho\'s Alpha Pro' });
                    
                    navigator.mediaSession.setActionHandler('previoustrack', () => {
                        const { isPaused, addPoint } = stateRef.current;
                        if (!isPaused) addPoint(1);
                    });
                    navigator.mediaSession.setActionHandler('nexttrack', () => {
                        const { isPaused, addPoint } = stateRef.current;
                        if (!isPaused) addPoint(2);
                    });
                    navigator.mediaSession.setActionHandler('play', () => {
                        const { isPaused, undo } = stateRef.current;
                        if (!isPaused) undo();
                    });
                    navigator.mediaSession.setActionHandler('pause', () => {
                        const { isPaused, undo } = stateRef.current;
                        if (!isPaused) undo();
                    });
                }
            }, [view]);
            // ==========================================

            const announceScore = (s1, s2, isWin = false, winName = "") => {
                if (isMuted || !window.speechSynthesis) return;
                window.speechSynthesis.cancel(); 
                const text = isWin ? `¡Juego para ${winName}!` : `Marcador: ${s1} a ${s2}`;
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-MX'; 
                utterance.rate = 1.05;
                window.speechSynthesis.speak(utterance);
            };

            const pointsToWin = mode === '1-15' ? 15 : 11;
            const setsNeeded = mode === '2-3' ? 2 : (mode === '3-5' ? 3 : 1);

            const { currentServer, servesRemaining } = useMemo(() => {
                const totalPoints = score1 + score2;
                const isDeuce = score1 >= 10 && score2 >= 10 && mode !== '1-15';
                const serveInterval = isDeuce ? 1 : 2;
                const cyclesPassed = Math.floor(totalPoints / serveInterval);
                const pointsInCurrentCycle = totalPoints % serveInterval;
                const remaining = serveInterval - pointsInCurrentCycle;
                let server = servingFirst === 1 ? (cyclesPassed % 2 === 0 ? 1 : 2) : (cyclesPassed % 2 === 0 ? 2 : 1);
                return { currentServer: server, servesRemaining: remaining };
            }, [score1, score2, servingFirst, mode]);

            const saveState = () => setHistory([...history, { score1, score2, sets1, sets2, winner, gameTime, matchTime, servingFirst, swapped }]);
            
            const undo = () => {
                if (history.length === 0) return;
                const last = history.pop();
                setScore1(last.score1); setScore2(last.score2);
                setSets1(last.sets1); setSets2(last.sets2);
                setWinner(last.winner); setGameTime(last.gameTime);
                setMatchTime(last.matchTime); setServingFirst(last.servingFirst);
                if (last.swapped !== undefined) setSwapped(last.swapped);
                setHistory([...history]);
            };

            const addPoint = (player) => {
                if (winner || isTimeoutActive || isPaused || showResetConfirm) return;
                saveState();
                let s1 = score1, s2 = score2;
                if (player === 1) s1++; else s2++;
                
                if (s1 >= pointsToWin && (s1 - s2 >= 2)) {
                    let ns1 = sets1 + 1;
                    setSets1(ns1);
                    if (ns1 === setsNeeded) { setWinner(p1); announceScore(0, 0, true, p1); }
                    else { 
                        setScore1(0); setScore2(0); setGameTime(0); 
                        setSwapped(prev => !prev); 
                        setServingFirst(prev => prev === 1 ? 2 : 1); 
                        announceScore(0, 0, true, p1); 
                    }
                } else if (s2 >= pointsToWin && (s2 - s1 >= 2)) {
                    let ns2 = sets2 + 1;
                    setSets2(ns2);
                    if (ns2 === setsNeeded) { setWinner(p2); announceScore(0, 0, true, p2); }
                    else { 
                        setScore1(0); setScore2(0); setGameTime(0); 
                        setSwapped(prev => !prev); 
                        setServingFirst(prev => prev === 1 ? 2 : 1); 
                        announceScore(0, 0, true, p2); 
                    }
                } else {
                    player === 1 ? setScore1(s1) : setScore2(s2);
                    announceScore(player === 1 ? s1 : score1, player === 2 ? s2 : score2);
                }
            };

            const finalize = () => {
                if (!winner) return;
                const newMatch = { id: Date.now(), player1: p1, player2: p2, winner, sets1, sets2, mode, timestamp: Date.now() };
                
                setMatches(prev => {
                    const actualizado = [...prev, newMatch];
                    localStorage.setItem('machos_matches', JSON.stringify(actualizado));
                    return actualizado;
                });
                
                exitMatch();
            };

            const resetMatch = () => {
                setScore1(0); setScore2(0); setSets1(0); setSets2(0); setWinner(null);
                setHistory([]); setGameTime(0); setMatchTime(0); setIsTimeoutActive(false); 
                setTimeoutSeconds(0); setIsPaused(false); setShowResetConfirm(false); setServingFirst(1);
                setSwapped(false); 
            };

            const startMatchWithAudio = () => {
                resetMatch(); 
                setView('match');
                const audio = document.getElementById('silentAudio');
                if (audio) { audio.play().catch(e => console.log(e)); }
                window.history.pushState({ inMatch: true }, "");
            };

            const exitMatch = () => {
                const audio = document.getElementById('silentAudio');
                if (audio) audio.pause();
                setView('setup');
            };

            const startTimeout = () => { setTimeoutSeconds(120); setIsTimeoutActive(true); };
            const changeServe = () => { saveState(); setServingFirst(prev => prev === 1 ? 2 : 1); };
            const formatTime = (s) => `${Math.floor(s/60)}:${(s%60).toString().padStart(2, '0')}`;

            const leaderboard = useMemo(() => {
                return JUGADORES.map(name => {
                    const pMatches = matches.filter(m => m.player1 === name || m.player2 === name);
                    const wins = pMatches.filter(m => m.winner === name).length;
                    return { name, wins, total: pMatches.length, rate: pMatches.length ? (wins/pMatches.length)*100 : 0 };
                }).sort((a,b) => b.rate - a.rate || b.wins - a.wins);
            }, [matches]);

            return (
                <div className="select-none min-h-screen text-slate-100 flex flex-col touch-manipulation">
                    
                    <audio id="silentAudio" src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA" loop playsInline preload="auto" style={{display: 'none'}}></audio>

                    {/* ==========================================
                        PANTALLA DE SETUP
                        ========================================== */}
                    {view === 'setup' && (
                        <div className="p-6 pb-24 w-full max-w-md mx-auto overflow-y-auto hide-scrollbar h-screen relative">
                            
                            <header className="text-center mb-10 pt-10 relative flex flex-col items-center">
                                {/* LUCES TRASERAS DEL LOGO */}
                                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-48 h-48 bg-white/10 rounded-full blur-[30px] z-0"></div>
                                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-cyan-500/20 rounded-full blur-[50px] z-0"></div>
                                <div className="absolute top-1/2 left-1/2 -translate-x-1/4 -translate-y-1/4 w-56 h-56 bg-fuchsia-500/20 rounded-full blur-[50px] z-0"></div>
                                
                                {/* LOGO */}
                                <img 
                                    src="./logo-machos.png" 
                                    alt="Macho's Alpha Logo" 
                                    className="w-56 object-contain relative z-10 mb-4"
                                    style={{ filter: 'drop-shadow(0px 0px 15px rgba(255,255,255,0.4)) drop-shadow(0px 0px 30px rgba(6,182,212,0.3))' }}
                                    onError={(e) => { e.target.style.display='none'; document.getElementById('fallback-title').style.display='block'; }}
                                />
                                
                                <h1 id="fallback-title" className="text-5xl font-black text-white italic tracking-tighter leading-none uppercase drop-shadow-[0_0_15px_rgba(255,255,255,0.2)] hidden relative z-10">
                                    MACHO'S<br/><span className="text-cyan-400">ALPHA</span>
                                </h1>
                                
                                <p className="text-cyan-400 text-[11px] font-bold tracking-[0.3em] uppercase font-digital relative z-10 mt-2 shadow-black">TABLE TENNIS</p>
                            </header>

                            <div className="space-y-8 relative z-10">
                                {/* JUGADOR 1 */}
                                <div>
                                    <p className="text-[9px] text-zinc-400 font-bold uppercase tracking-widest mb-3 ml-2">Selecciona Jugador 1</p>
                                    <div className="grid grid-cols-2 gap-3">
                                        {JUGADORES.map(n => 
                                            <button 
                                                key={n} 
                                                onClick={() => setP1(n)} 
                                                className={`py-4 rounded-xl font-bold text-xs btn-3d ${p1 === n ? 'btn-cyan' : 'btn-off hover:bg-slate-700 hover:text-white'}`}
                                            >
                                                {n}
                                            </button>
                                        )}
                                    </div>
                                </div>

                                {/* JUGADOR 2 */}
                                <div>
                                    <p className="text-[9px] text-zinc-400 font-bold uppercase tracking-widest mb-3 ml-2">Selecciona Jugador 2</p>
                                    <div className="grid grid-cols-2 gap-3">
                                        {JUGADORES.map(n => 
                                            <button 
                                                key={n} 
                                                onClick={() => setP2(n)} 
                                                className={`py-4 rounded-xl font-bold text-xs btn-3d ${p2 === n ? 'btn-fuchsia' : 'btn-off hover:bg-slate-700 hover:text-white'}`}
                                            >
                                                {n}
                                            </button>
                                        )}
                                    </div>
                                </div>
                                
                                {/* MODO DE JUEGO */}
                                <div className="flex gap-3 mt-8">
                                    {['2-3', '3-5', '1-15'].map(m => 
                                        <button 
                                            key={m} 
                                            onClick={() => setMode(m)} 
                                            className={`flex-1 py-3 rounded-xl font-bold text-[10px] tracking-widest uppercase btn-3d ${mode === m ? 'btn-white' : 'btn-off hover:bg-slate-700 hover:text-white'}`}
                                        >
                                            {m === '2-3' ? '2 DE 3' : m === '3-5' ? '3 DE 5' : '1 A 15'}
                                        </button>
                                    )}
                                </div>

                                <button disabled={!p1 || !p2 || p1 === p2} onClick={startMatchWithAudio} className="w-full py-5 rounded-2xl font-black uppercase tracking-widest text-sm btn-3d btn-white mt-6 disabled:opacity-30 disabled:shadow-none">
                                    Comenzar Duelo
                                </button>
                                
                                <button onClick={() => setView('ranking')} className="w-full text-zinc-500 font-bold uppercase text-[9px] tracking-widest py-6 hover:text-cyan-400 transition-colors flex justify-center items-center gap-2">
                                    <i className="fa-solid fa-trophy mr-1"></i> Ver Leaderboard Online
                                </button>
                            </div>
                        </div>
                    )}

                    {/* ==========================================
                        PANTALLA DE RANKING
                        ========================================== */}
                    {view === 'ranking' && (
                        <div className="p-6 pb-20 w-full max-w-md mx-auto overflow-y-auto hide-scrollbar h-screen">
                            <button onClick={() => setView('setup')} className="mb-8 text-zinc-400 font-bold uppercase text-[10px] tracking-widest flex items-center gap-2 hover:text-white"><i className="fa-solid fa-chevron-left"></i> Volver</button>
                            <h2 className="text-4xl font-black italic mb-2 uppercase tracking-tighter text-white">RANKING</h2>
                            <p className="text-cyan-400 text-xs font-black tracking-widest mb-4 uppercase">Portal de Usuarios</p>
                            
                            <div className="space-y-3 mt-8">
                                {leaderboard.map((s, i) => (
                                    <div key={s.name} onClick={() => setSelectedPlayerStats(s.name)} className={`flex items-center p-5 rounded-2xl cursor-pointer btn-3d ${i === 0 ? 'btn-cyan' : 'btn-off hover:bg-slate-700'}`}>
                                        <span className={`w-8 font-black font-digital text-xl ${i === 0 ? 'text-white' : 'text-zinc-500'}`}>{i+1}</span>
                                        <div className="flex-1 px-4 border-l border-white/10 ml-2 pl-4">
                                            <p className="font-bold text-sm uppercase text-white tracking-widest">{s.name}</p>
                                            <p className={`text-[9px] font-bold uppercase mt-1 ${i === 0 ? 'text-cyan-100' : 'text-zinc-400'}`}>{s.wins} Ganados / {s.total} Total</p>
                                        </div>
                                        <div className="text-right">
                                            <span className="text-xl font-black leading-none text-white font-digital">{Math.round(s.rate)}<span className="text-[10px] text-white/50">%</span></span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* MODAL DE ESTADÍSTICAS DEL JUGADOR */}
                    {selectedPlayerStats && (() => {
                        const pMatches = matches.filter(m => m.player1 === selectedPlayerStats || m.player2 === selectedPlayerStats).sort((a,b) => b.timestamp - a.timestamp);
                        const wins = pMatches.filter(m => m.winner === selectedPlayerStats).length;
                        const losses = pMatches.length - wins;

                        return (
                            <div className="fixed inset-0 bg-black/90 backdrop-blur-xl z-[700] flex flex-col p-6 overflow-y-auto animate-in slide-in-from-bottom duration-300">
                                <button onClick={() => setSelectedPlayerStats(null)} className="absolute top-6 right-6 w-12 h-12 btn-3d btn-off rounded-full flex items-center justify-center text-white">
                                    <i className="fa-solid fa-xmark text-xl"></i>
                                </button>
                                <h2 className="text-4xl font-black italic text-white uppercase mt-16 mb-2 tracking-widest">{selectedPlayerStats}</h2>
                                <p className="text-cyan-400 font-bold tracking-[0.2em] text-[10px] uppercase mb-8">Estadísticas</p>
                                
                                <div className="flex gap-4 mb-8">
                                    <div className="flex-1 btn-3d btn-cyan rounded-[20px] p-5 text-center">
                                        <p className="text-[9px] text-cyan-100 font-bold uppercase tracking-widest mb-2">Victorias</p>
                                        <p className="text-4xl font-black text-white font-digital">{wins}</p>
                                    </div>
                                    <div className="flex-1 btn-3d btn-fuchsia rounded-[20px] p-5 text-center">
                                        <p className="text-[9px] text-fuchsia-100 font-bold uppercase tracking-widest mb-2">Derrotas</p>
                                        <p className="text-4xl font-black text-white font-digital">{losses}</p>
                                    </div>
                                </div>
                            </div>
                        )
                    })()}

                    {/* ==========================================
                        VISTA DEL MARCADOR EN VIVO (MATCH)
                        ========================================== */}
                    {view === 'match' && (
                        <div className="fixed inset-0 flex flex-col z-50 bg-[#090a0f] overflow-hidden">
                            
                            {/* TOP BAR */}
                            <div className="glass-dark py-3 px-6 flex justify-between items-center text-white shrink-0 z-20 border-b border-white/5">
                                <button onClick={exitMatch} className="text-zinc-500 font-bold text-[9px] flex items-center gap-2 uppercase tracking-widest hover:text-white transition-colors">
                                    <i className="fa-solid fa-chevron-left"></i> Salir
                                </button>
                                <span className="text-[9px] font-bold tracking-[0.3em] text-zinc-400 font-digital">TABLE TENNIS</span>
                                <button onClick={(e) => { e.stopPropagation(); setIsMuted(!isMuted); }} className={`text-zinc-500 p-2 rounded-full transition-colors ${isMuted ? 'text-rose-500' : 'hover:text-cyan-400'}`}>
                                    {isMuted ? <i className="fa-solid fa-volume-xmark"></i> : <i className="fa-solid fa-volume-high"></i>}
                                </button>
                            </div>

                            <div className="flex-1 flex flex-col landscape:flex-row w-full p-3 landscape:p-6 gap-4 overflow-hidden min-h-0">

                                {/* ================================= JUGADOR 1 ================================= */}
                                <div className={`flex-1 flex flex-col min-h-0 min-w-0 ${swapped ? 'order-3' : 'order-1'}`}>
                                    
                                    {/* Etiqueta de Nombre 3D */}
                                    <div className="name-p1 py-4 px-5 rounded-[20px] flex items-center justify-between shrink-0 relative overflow-hidden transition-transform">
                                        <div className="w-10 md:w-14"></div> 
                                        <div className="flex flex-col items-center">
                                            <h2 className="text-white text-center font-bold text-2xl landscape:text-3xl tracking-widest uppercase leading-none">{p1}</h2>
                                            <div className="h-1 w-full flex justify-center gap-2 mt-3">
                                                {currentServer === 1 && Array.from({length: servesRemaining}).map((_, i) => (
                                                    <div key={i} className="h-1 w-6 bg-white rounded-full shadow-[0_0_5px_white] animate-pulse"></div>
                                                ))}
                                            </div>
                                        </div>
                                        <div className="w-10 h-10 bg-black/20 border border-white/20 rounded-lg flex items-center justify-center text-white font-digital font-bold text-xl">{sets1}</div>
                                    </div>

                                    {/* Marcador Gigante 3D */}
                                    <div onClick={() => addPoint(1)} className="flex-1 card-score score-p1 rounded-[30px] flex flex-col items-center justify-center relative cursor-pointer overflow-hidden min-h-0">
                                        <div className="text-white text-[25vh] landscape:text-[45vh] font-digital font-black leading-none tracking-tighter select-none" style={{ textShadow: '0 0 40px rgba(6,182,212,0.6)' }}>{score1}</div>
                                    </div>
                                </div>

                                {/* ================================= CONTROLES CENTRALES ================================= */}
                                <div className="flex flex-row landscape:flex-col items-center justify-center gap-4 shrink-0 py-1 landscape:py-0 z-20">
                                    <button onClick={undo} className="w-12 h-12 landscape:w-14 landscape:h-14 rounded-full flex items-center justify-center btn-3d btn-off"><i className="fa-solid fa-rotate-left text-lg"></i></button>
                                    <button onClick={() => { saveState(); setSwapped(prev => !prev); }} className="w-12 h-12 landscape:w-14 landscape:h-14 rounded-full flex items-center justify-center btn-3d btn-off"><i className="fa-solid fa-shuffle text-lg"></i></button>
                                    <button onClick={changeServe} className="w-12 h-12 landscape:w-14 landscape:h-14 rounded-full flex items-center justify-center btn-3d btn-off"><i className="fa-solid fa-right-left text-lg"></i></button>
                                    <button onClick={startTimeout} className="w-12 h-12 landscape:w-14 landscape:h-14 rounded-full flex items-center justify-center btn-3d btn-orange"><i className="fa-solid fa-stopwatch text-lg"></i></button>
                                    <button onClick={() => setShowResetConfirm(true)} className="w-12 h-12 landscape:w-14 landscape:h-14 rounded-full flex items-center justify-center btn-3d btn-red"><i className="fa-solid fa-power-off text-lg"></i></button>
                                </div>

                                {/* ================================= JUGADOR 2 ================================= */}
                                <div className={`flex-1 flex flex-col min-h-0 min-w-0 ${swapped ? 'order-1' : 'order-3'}`}>
                                    
                                    {/* Etiqueta de Nombre 3D */}
                                    <div className="name-p2 py-4 px-5 rounded-[20px] flex items-center justify-between shrink-0 relative overflow-hidden transition-transform">
                                        <div className="w-10 h-10 bg-black/20 border border-white/20 rounded-lg flex items-center justify-center text-white font-digital font-bold text-xl">{sets2}</div>
                                        <div className="flex flex-col items-center">
                                            <h2 className="text-white text-center font-bold text-2xl landscape:text-3xl tracking-widest uppercase leading-none">{p2}</h2>
                                            <div className="h-1 w-full flex justify-center gap-2 mt-3">
                                                {currentServer === 2 && Array.from({length: servesRemaining}).map((_, i) => (
                                                    <div key={i} className="h-1 w-6 bg-white rounded-full shadow-[0_0_5px_white] animate-pulse"></div>
                                                ))}
                                            </div>
                                        </div>
                                        <div className="w-10 md:w-14"></div>
                                    </div>

                                    {/* Marcador Gigante 3D */}
                                    <div onClick={() => addPoint(2)} className="flex-1 card-score score-p2 rounded-[30px] flex flex-col items-center justify-center relative cursor-pointer overflow-hidden min-h-0">
                                        <div className="text-white text-[25vh] landscape:text-[45vh] font-digital font-black leading-none tracking-tighter select-none" style={{ textShadow: '0 0 40px rgba(217,70,239,0.6)' }}>{score2}</div>
                                        <div className="absolute bottom-5 right-6 text-fuchsia-400/50 font-digital text-[10px] uppercase tracking-widest">TIME: {formatTime(matchTime)}</div>
                                    </div>
                                </div>
                            </div>

                            {/* ==========================================
                                MODALES DE JUEGO (PAUSA, RESET, GANADOR)
                                ========================================== */}
                            {isTimeoutActive && (
                                <div className="fixed inset-0 bg-black/90 backdrop-blur-lg z-[500] flex flex-col items-center justify-center p-10 text-white animate-in zoom-in">
                                    <i className="fa-solid fa-stopwatch text-5xl mb-8 text-orange-500"></i>
                                    <h3 className="text-xl font-bold uppercase tracking-[0.4em] mb-4 text-white">Pausa Táctica</h3>
                                    <div className="text-[12vh] font-digital font-black leading-none tracking-widest text-white mb-16">{formatTime(timeoutSeconds)}</div>
                                    <button onClick={() => setIsTimeoutActive(false)} className="px-12 py-5 rounded-2xl font-black uppercase tracking-widest text-sm btn-3d btn-orange">Reanudar Partido</button>
                                </div>
                            )}

                            {showResetConfirm && (
                                <div className="fixed inset-0 bg-black/90 backdrop-blur-lg z-[500] flex flex-col items-center justify-center p-6 text-white animate-in zoom-in">
                                    <div className="glass-dark border border-white/10 p-10 rounded-[30px] max-w-sm w-full flex flex-col items-center">
                                        <i className="fa-solid fa-triangle-exclamation text-4xl mb-6 text-rose-500"></i>
                                        <h3 className="text-xl font-bold uppercase tracking-widest mb-3 text-center">¿Juego Nuevo?</h3>
                                        <p className="text-zinc-500 text-xs text-center mb-10">El progreso actual se perderá.</p>
                                        <div className="flex gap-4 w-full">
                                            <button onClick={() => setShowResetConfirm(false)} className="flex-1 py-4 rounded-xl font-bold uppercase tracking-widest text-xs btn-3d btn-off">Cancelar</button>
                                            <button onClick={resetMatch} className="flex-1 py-4 rounded-xl font-bold uppercase tracking-widest text-xs btn-3d btn-red">Reiniciar</button>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {winner && (
                                <div className="fixed inset-0 bg-black/95 backdrop-blur-xl z-[600] flex flex-col items-center justify-center text-center p-6 animate-in zoom-in duration-500">
                                    <div className="w-24 h-24 rounded-full btn-3d btn-cyan flex items-center justify-center mb-8">
                                        <i className="fa-solid fa-trophy text-4xl text-white"></i>
                                    </div>
                                    <p className="text-cyan-400 font-bold uppercase tracking-[0.4em] text-[10px] mb-4">Victoria Confirmada</p>
                                    <h2 className="text-[8vh] font-black text-white mb-16 uppercase tracking-widest leading-none drop-shadow-[0_0_15px_rgba(255,255,255,0.2)]">{winner}</h2>
                                    <div className="flex flex-col landscape:flex-row w-full gap-4 max-w-sm">
                                        <button onClick={finalize} className="flex-1 py-5 rounded-xl font-black uppercase tracking-widest text-xs btn-3d btn-white">Guardar Stats</button>
                                        <button onClick={undo} className="flex-1 py-5 rounded-xl font-bold uppercase tracking-widest text-xs btn-3d btn-off">Revertir Error</button>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
