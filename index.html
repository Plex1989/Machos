<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MACHO'S ALPHA | Umpire Pro v3.0</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- FUENTES PROFESIONALES -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,900;1,900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
    
    <style>
        body { 
            background: radial-gradient(circle at center, #1e1e2f 0%, #0a0a0f 100%);
            color: white; 
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent; 
            overscroll-behavior: none; 
            overflow: hidden; /* Evita que la pantalla se mueva por accidente */
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* UTILIDADES VISUALES PRO */
        .font-digital { font-family: 'Orbitron', sans-serif; }
        .glass-panel { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .neon-text-red { text-shadow: 0 0 10px rgba(225, 29, 72, 0.8), 0 0 20px rgba(225, 29, 72, 0.4); }
        .neon-text-cyan { text-shadow: 0 0 10px rgba(6, 182, 212, 0.8), 0 0 20px rgba(6, 182, 212, 0.4); }
        
        /* BOTONES 3D */
        .btn-3d { transition: all 0.1s ease; border-bottom-width: 4px; }
        .btn-3d:active { border-bottom-width: 0px; transform: translateY(4px); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useMemo, useRef } = React;
        
        const JUGADORES = ["ANDRADE", "ISAI", "VILLEGAS", "ARTURO", "CUTBERTO", "GABRIEL", "LUIS", "ROBIN"];

        function App() {
            const [view, setView] = useState('setup'); 
            
            const [matches, setMatches] = useState(() => {
                const guardado = localStorage.getItem('machos_matches');
                if (guardado) {
                    try { return JSON.parse(guardado); } catch(e) { return []; }
                }
                return [];
            });
            
            const [p1, setP1] = useState(null);
            const [p2, setP2] = useState(null);
            const [mode, setMode] = useState('2-3'); 
            const [score1, setScore1] = useState(0);
            const [score2, setScore2] = useState(0);
            const [sets1, setSets1] = useState(0);
            const [sets2, setSets2] = useState(0);
            const [winner, setWinner] = useState(null);
            const [history, setHistory] = useState([]); 
            const [servingFirst, setServingFirst] = useState(1); 
            const [swapped, setSwapped] = useState(false);
            
            const [matchTime, setMatchTime] = useState(0);
            const [gameTime, setGameTime] = useState(0);
            const [timeoutSeconds, setTimeoutSeconds] = useState(0);
            const [isTimeoutActive, setIsTimeoutActive] = useState(false);
            const [isPaused, setIsPaused] = useState(false);
            const [showResetConfirm, setShowResetConfirm] = useState(false);
            const [isMuted, setIsMuted] = useState(false); 
            
            const [selectedPlayerStats, setSelectedPlayerStats] = useState(null);
            
            const timerRef = useRef(null);
            const stateRef = useRef({});

            useEffect(() => {
                localStorage.setItem('machos_matches', JSON.stringify(matches));
            }, [matches]);

            useEffect(() => {
                if (view === 'match' && !winner && !isPaused && !showResetConfirm) {
                    timerRef.current = setInterval(() => {
                        if (isTimeoutActive) {
                            setTimeoutSeconds(s => { if (s <= 1) { setIsTimeoutActive(false); return 0; } return s - 1; });
                        } else {
                            setMatchTime(t => t + 1);
                            setGameTime(t => t + 1);
                        }
                    }, 1000);
                } else {
                    clearInterval(timerRef.current);
                }
                return () => clearInterval(timerRef.current);
            }, [view, winner, isTimeoutActive, isPaused, showResetConfirm]);

            // ==========================================
            // CONTROL BLUETOOTH / ANILLO
            // ==========================================
            useEffect(() => {
                stateRef.current = { view, isPaused, addPoint, undo, startTimeout, winner, showResetConfirm };
            });

            useEffect(() => {
                const handlePopState = (e) => {
                    const { view, winner, showResetConfirm } = stateRef.current;
                    if (view === 'match' && !winner && !showResetConfirm) {
                        window.history.pushState({ inMatch: true }, ""); 
                    }
                };
                window.addEventListener('popstate', handlePopState);

                const handleKeyDown = (e) => {
                    const { view, isPaused, addPoint, undo, startTimeout, winner, showResetConfirm } = stateRef.current;

                    if (view !== 'match' || winner || showResetConfirm) return;

                    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','PageUp','PageDown','AudioVolumeUp','AudioVolumeDown','BrowserBack'].includes(e.key)) {
                        e.preventDefault(); 
                    }

                    switch(e.key) {
                        case 'ArrowLeft': case 'MediaTrackPrevious': case 'MediaRewind':
                            if (!isPaused) addPoint(1); break;
                        case 'ArrowRight': case 'MediaTrackNext': case 'MediaFastForward':
                            if (!isPaused) addPoint(2); break;
                        case 'MediaPlayPause': case 'Pause': case 'Play': case 'Enter': case ' ':
                            if (!isPaused) undo(); break;
                        case 'ArrowUp': case 'PageUp':
                            if (!isPaused) startTimeout(); break;
                    }
                };
                window.addEventListener('keydown', handleKeyDown);

                return () => {
                    window.removeEventListener('popstate', handlePopState);
                    window.removeEventListener('keydown', handleKeyDown);
                };
            }, []);

            useEffect(() => {
                if (view === 'match' && 'mediaSession' in navigator) {
                    navigator.mediaSession.metadata = new MediaMetadata({ title: 'Torneo Activo', artist: 'Macho\'s Alpha Pro' });
                    
                    navigator.mediaSession.setActionHandler('previoustrack', () => {
                        const { isPaused, addPoint } = stateRef.current;
                        if (!isPaused) addPoint(1);
                    });
                    navigator.mediaSession.setActionHandler('nexttrack', () => {
                        const { isPaused, addPoint } = stateRef.current;
                        if (!isPaused) addPoint(2);
                    });
                    navigator.mediaSession.setActionHandler('play', () => {
                        const { isPaused, undo } = stateRef.current;
                        if (!isPaused) undo();
                    });
                    navigator.mediaSession.setActionHandler('pause', () => {
                        const { isPaused, undo } = stateRef.current;
                        if (!isPaused) undo();
                    });
                }
            }, [view]);
            // ==========================================

            const announceScore = (s1, s2, isWin = false, winName = "") => {
                if (isMuted || !window.speechSynthesis) return;
                window.speechSynthesis.cancel(); 
                const text = isWin ? `¡Juego para ${winName}!` : `Marcador: ${s1} a ${s2}`;
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-MX'; 
                utterance.rate = 1.05;
                window.speechSynthesis.speak(utterance);
            };

            const pointsToWin = mode === '1-15' ? 15 : 11;
            const setsNeeded = mode === '2-3' ? 2 : (mode === '3-5' ? 3 : 1);

            const { currentServer, servesRemaining } = useMemo(() => {
                const totalPoints = score1 + score2;
                const isDeuce = score1 >= 10 && score2 >= 10 && mode !== '1-15';
                const serveInterval = isDeuce ? 1 : 2;
                const cyclesPassed = Math.floor(totalPoints / serveInterval);
                const pointsInCurrentCycle = totalPoints % serveInterval;
                const remaining = serveInterval - pointsInCurrentCycle;
                let server = servingFirst === 1 ? (cyclesPassed % 2 === 0 ? 1 : 2) : (cyclesPassed % 2 === 0 ? 2 : 1);
                return { currentServer: server, servesRemaining: remaining };
            }, [score1, score2, servingFirst, mode]);

            const saveState = () => setHistory([...history, { score1, score2, sets1, sets2, winner, gameTime, matchTime, servingFirst, swapped }]);
            
            const undo = () => {
                if (history.length === 0) return;
                const last = history.pop();
                setScore1(last.score1); setScore2(last.score2);
                setSets1(last.sets1); setSets2(last.sets2);
                setWinner(last.winner); setGameTime(last.gameTime);
                setMatchTime(last.matchTime); setServingFirst(last.servingFirst);
                if (last.swapped !== undefined) setSwapped(last.swapped);
                setHistory([...history]);
            };

            const addPoint = (player) => {
                if (winner || isTimeoutActive || isPaused || showResetConfirm) return;
                saveState();
                let s1 = score1, s2 = score2;
                if (player === 1) s1++; else s2++;
                
                if (s1 >= pointsToWin && (s1 - s2 >= 2)) {
                    let ns1 = sets1 + 1;
                    setSets1(ns1);
                    if (ns1 === setsNeeded) { setWinner(p1); announceScore(0, 0, true, p1); }
                    else { 
                        setScore1(0); setScore2(0); setGameTime(0); 
                        setSwapped(prev => !prev); 
                        setServingFirst(prev => prev === 1 ? 2 : 1); 
                        announceScore(0, 0, true, p1); 
                    }
                } else if (s2 >= pointsToWin && (s2 - s1 >= 2)) {
                    let ns2 = sets2 + 1;
                    setSets2(ns2);
                    if (ns2 === setsNeeded) { setWinner(p2); announceScore(0, 0, true, p2); }
                    else { 
                        setScore1(0); setScore2(0); setGameTime(0); 
                        setSwapped(prev => !prev); 
                        setServingFirst(prev => prev === 1 ? 2 : 1); 
                        announceScore(0, 0, true, p2); 
                    }
                } else {
                    player === 1 ? setScore1(s1) : setScore2(s2);
                    announceScore(player === 1 ? s1 : score1, player === 2 ? s2 : score2);
                }
            };

            const finalize = () => {
                if (!winner) return;
                const newMatch = { id: Date.now(), player1: p1, player2: p2, winner, sets1, sets2, mode, timestamp: Date.now() };
                
                setMatches(prev => {
                    const actualizado = [...prev, newMatch];
                    localStorage.setItem('machos_matches', JSON.stringify(actualizado));
                    return actualizado;
                });
                
                exitMatch();
            };

            const resetMatch = () => {
                setScore1(0); setScore2(0); setSets1(0); setSets2(0); setWinner(null);
                setHistory([]); setGameTime(0); setMatchTime(0); setIsTimeoutActive(false); 
                setTimeoutSeconds(0); setIsPaused(false); setShowResetConfirm(false); setServingFirst(1);
                setSwapped(false); 
            };

            const startMatchWithAudio = () => {
                resetMatch(); 
                setView('match');
                const audio = document.getElementById('silentAudio');
                if (audio) { audio.play().catch(e => console.log(e)); }
                window.history.pushState({ inMatch: true }, "");
            };

            const exitMatch = () => {
                const audio = document.getElementById('silentAudio');
                if (audio) audio.pause();
                setView('setup');
            };

            const startTimeout = () => { setTimeoutSeconds(120); setIsTimeoutActive(true); };
            const changeServe = () => { saveState(); setServingFirst(prev => prev === 1 ? 2 : 1); };
            const formatTime = (s) => `${Math.floor(s/60)}:${(s%60).toString().padStart(2, '0')}`;

            const leaderboard = useMemo(() => {
                return JUGADORES.map(name => {
                    const pMatches = matches.filter(m => m.player1 === name || m.player2 === name);
                    const wins = pMatches.filter(m => m.winner === name).length;
                    return { name, wins, total: pMatches.length, rate: pMatches.length ? (wins/pMatches.length)*100 : 0 };
                }).sort((a,b) => b.rate - a.rate || b.wins - a.wins);
            }, [matches]);

            return (
                <div className="select-none min-h-screen text-slate-100 flex flex-col touch-manipulation">
                    
                    <audio id="silentAudio" src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA" loop playsInline preload="auto" style={{display: 'none'}}></audio>

                    {/* VISTA DE CONFIGURACIÓN Y RANKING */}
                    {view === 'setup' && (
                        <div className="p-6 pb-24 w-full max-w-md mx-auto overflow-y-auto hide-scrollbar h-screen">
                            <header className="text-center mb-8 pt-8">
                                <h1 className="text-6xl font-black text-white italic tracking-tighter leading-none uppercase drop-shadow-[0_0_15px_rgba(255,255,255,0.3)]">MACHO'S<br/><span className="text-rose-500 neon-text-red">ALPHA</span></h1>
                                <p className="text-zinc-400 text-[10px] font-bold tracking-[0.4em] mt-3 uppercase font-digital">Umpire Pro v3.0</p>
                            </header>

                            <div className="space-y-6 relative z-10">
                                <div className="grid grid-cols-2 gap-3">
                                    {JUGADORES.map(n => <button key={n} onClick={() => setP1(n)} className={`py-4 rounded-xl font-black text-xs transition-all btn-3d ${p1 === n ? 'bg-gradient-to-r from-rose-600 to-rose-500 border-rose-900 text-white shadow-[0_0_20px_rgba(225,29,72,0.6)]' : 'glass-panel border-black/50 text-zinc-400 hover:text-white'}`}>{n}</button>)}
                                </div>
                                <div className="text-zinc-500 text-center font-black text-lg italic py-1 drop-shadow-[0_0_5px_rgba(255,255,255,0.5)]">VS</div>
                                <div className="grid grid-cols-2 gap-3">
                                    {JUGADORES.map(n => <button key={n} onClick={() => setP2(n)} className={`py-4 rounded-xl font-black text-xs transition-all btn-3d ${p2 === n ? 'bg-gradient-to-r from-cyan-600 to-cyan-500 border-cyan-900 text-white shadow-[0_0_20px_rgba(6,182,212,0.6)]' : 'glass-panel border-black/50 text-zinc-400 hover:text-white'}`}>{n}</button>)}
                                </div>
                                
                                <div className="flex gap-2 mt-8">
                                    {['2-3', '3-5', '1-15'].map(m => <button key={m} onClick={() => setMode(m)} className={`flex-1 py-4 rounded-xl font-bold text-[10px] transition-colors btn-3d ${mode === m ? 'bg-white text-black border-zinc-400 shadow-[0_0_15px_rgba(255,255,255,0.5)]' : 'glass-panel text-zinc-400 border-black/50'}`}>{m === '1-15' ? '1 SET A 15' : `MEJOR DE ${m.split('-')[1]}`}</button>)}
                                </div>

                                <button disabled={!p1 || !p2 || p1 === p2} onClick={startMatchWithAudio} className="w-full bg-gradient-to-r from-emerald-500 to-emerald-400 border-b-4 border-emerald-800 btn-3d py-6 rounded-2xl text-white font-black uppercase tracking-widest text-lg shadow-[0_0_20px_rgba(16,185,129,0.4)] mt-6 disabled:opacity-30 disabled:grayscale">
                                    Iniciar Partido
                                </button>
                                
                                <button onClick={() => setView('ranking')} className="w-full text-zinc-400 font-bold uppercase text-[10px] tracking-widest py-6 hover:text-white transition-colors flex justify-center items-center gap-2">
                                    <i className="fa-solid fa-trophy mr-2 text-yellow-500"></i> Ver Leaderboard Global
                                </button>
                            </div>
                        </div>
                    )}

                    {view === 'ranking' && (
                        <div className="p-6 pb-20 w-full max-w-md mx-auto overflow-y-auto hide-scrollbar h-screen">
                            <button onClick={() => setView('setup')} className="mb-8 text-zinc-400 font-bold uppercase text-[10px] tracking-widest flex items-center gap-2 hover:text-white"><i className="fa-solid fa-chevron-left"></i> Volver</button>
                            <h2 className="text-4xl font-black italic mb-2 uppercase tracking-tighter text-white">MACHO'S ALPHA</h2>
                            <p className="text-cyan-400 text-xs font-black tracking-widest mb-4 uppercase">Leaderboard Global</p>
                            
                            <div className="space-y-3 mt-8">
                                {leaderboard.map((s, i) => (
                                    <div key={s.name} onClick={() => setSelectedPlayerStats(s.name)} className={`flex items-center p-5 rounded-3xl btn-3d cursor-pointer ${i === 0 ? 'bg-gradient-to-r from-yellow-600/20 to-yellow-500/10 border border-yellow-500/50 border-b-4 border-b-yellow-900/50 shadow-[0_0_15px_rgba(234,179,8,0.2)]' : 'glass-panel border-b-4 border-b-black/50'}`}>
                                        <span className={`w-8 font-black font-digital text-xl ${i === 0 ? 'text-yellow-500' : 'text-zinc-500'}`}>{i+1}</span>
                                        <div className="flex-1 px-4">
                                            <p className="font-black text-sm uppercase text-white">{s.name}</p>
                                            <p className="text-[9px] text-cyan-500 font-bold uppercase mt-1">{s.wins} Ganados / {s.total} Partidos</p>
                                        </div>
                                        <div className="text-right">
                                            <span className="text-2xl font-black leading-none text-white font-digital">{Math.round(s.rate)}%</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {selectedPlayerStats && (() => {
                        const pMatches = matches.filter(m => m.player1 === selectedPlayerStats || m.player2 === selectedPlayerStats).sort((a,b) => b.timestamp - a.timestamp);
                        const wins = pMatches.filter(m => m.winner === selectedPlayerStats).length;
                        const losses = pMatches.length - wins;

                        return (
                            <div className="fixed inset-0 bg-black/80 backdrop-blur-xl z-[700] flex flex-col p-6 overflow-y-auto animate-in slide-in-from-bottom duration-300">
                                <button onClick={() => setSelectedPlayerStats(null)} className="absolute top-6 right-6 w-12 h-12 glass-panel border-b-4 border-b-black/50 btn-3d rounded-full flex items-center justify-center text-white">
                                    <i className="fa-solid fa-xmark text-xl"></i>
                                </button>
                                <h2 className="text-5xl font-black italic text-white uppercase mt-12 mb-2 tracking-tighter drop-shadow-[0_0_10px_rgba(255,255,255,0.5)]">{selectedPlayerStats}</h2>
                                <p className="text-cyan-400 font-black tracking-[0.3em] text-[10px] uppercase mb-8">Expediente de Batallas</p>
                                <div className="flex gap-4 mb-8">
                                    <div className="flex-1 glass-panel rounded-[20px] p-5 text-center shadow-[inset_0_0_20px_rgba(16,185,129,0.1)] border-emerald-500/30">
                                        <p className="text-[10px] text-zinc-400 font-bold uppercase mb-2">Victorias</p>
                                        <p className="text-4xl font-black text-emerald-400 font-digital">{wins}</p>
                                    </div>
                                    <div className="flex-1 glass-panel rounded-[20px] p-5 text-center shadow-[inset_0_0_20px_rgba(225,29,72,0.1)] border-rose-500/30">
                                        <p className="text-[10px] text-zinc-400 font-bold uppercase mb-2">Derrotas</p>
                                        <p className="text-4xl font-black text-rose-500 font-digital">{losses}</p>
                                    </div>
                                </div>
                            </div>
                        )
                    })()}

                    {/* VISTA DEL MARCADOR EN VIVO (MATCH) */}
                    {view === 'match' && (
                        <div className="fixed inset-0 flex flex-col z-50 bg-[#0a0a0f] overflow-hidden">
                            
                            {/* Top Bar Glassmorphism */}
                            <div className="glass-panel py-2 px-4 flex justify-between items-center text-white shrink-0 z-20 border-b border-white/10 shadow-lg">
                                <button onClick={exitMatch} className="text-zinc-400 font-bold text-[10px] flex items-center gap-1 uppercase tracking-widest hover:text-rose-400 transition-colors">
                                    <i className="fa-solid fa-chevron-left"></i> Salir
                                </button>
                                <span className="text-[10px] font-black italic tracking-widest text-zinc-300 drop-shadow-[0_0_5px_rgba(255,255,255,0.5)]">MACHO'S ALPHA v3.0</span>
                                <button onClick={(e) => { e.stopPropagation(); setIsMuted(!isMuted); }} className={`text-zinc-400 p-2 rounded-full transition-colors ${isMuted ? 'text-rose-500 neon-text-red' : 'hover:text-cyan-400'}`}>
                                    {isMuted ? <i className="fa-solid fa-volume-xmark"></i> : <i className="fa-solid fa-volume-high"></i>}
                                </button>
                            </div>

                            {/* CONTENEDOR PRINCIPAL: ARREGLO DE LANDSCAPE */}
                            {/* min-h-0 es la magia para que flexbox no desborde la pantalla en horizontal */}
                            <div className="flex-1 flex flex-col landscape:flex-row w-full p-2 landscape:p-4 gap-3 overflow-hidden min-h-0">

                                {/* JUGADOR 1 (ROJO NEÓN) */}
                                <div className={`flex-1 flex flex-col gap-3 min-h-0 min-w-0 ${swapped ? 'order-3' : 'order-1'}`}>
                                    
                                    {/* Nombre y Sets */}
                                    <div className="bg-gradient-to-r from-rose-700 to-rose-500 border-b-4 border-rose-950 py-3 px-4 rounded-[20px] shadow-[0_0_20px_rgba(225,29,72,0.4)] flex items-center justify-between shrink-0">
                                        <div className="w-10 md:w-14"></div> 
                                        <div className="flex flex-col items-center">
                                            <h2 className="text-white text-center font-black text-3xl landscape:text-4xl tracking-tighter uppercase leading-none drop-shadow-md">{p1}</h2>
                                            <div className="h-1.5 w-full flex justify-center gap-2 mt-2">
                                                {currentServer === 1 && Array.from({length: servesRemaining}).map((_, i) => (
                                                    <div key={i} className="h-1.5 w-8 bg-white rounded-full shadow-[0_0_8px_white] animate-pulse"></div>
                                                ))}
                                            </div>
                                        </div>
                                        <div className="w-12 h-12 bg-black/50 border border-rose-400/50 rounded-full flex items-center justify-center text-white font-digital font-bold text-2xl shadow-inner">{sets1}</div>
                                    </div>

                                    {/* Marcador Principal */}
                                    <div onClick={() => addPoint(1)} className="flex-1 glass-panel border border-rose-500/20 rounded-[30px] shadow-[inset_0_0_30px_rgba(225,29,72,0.15)] flex flex-col items-center justify-center relative active:scale-[0.98] transition-transform cursor-pointer overflow-hidden min-h-0">
                                        <div className="absolute top-4 left-6 text-rose-400/60 font-digital text-[10px] uppercase tracking-widest">P1</div>
                                        
                                        {/* Número responsivo: Se ajusta según la altura en portrait y landscape */}
                                        <div className="text-white text-[25vh] landscape:text-[45vh] font-digital font-black leading-none tracking-tighter select-none neon-text-red">{score1}</div>
                                    </div>
                                </div>

                                {/* CONTROLES CENTRALES (BOTONES 3D GLASS) */}
                                <div className="flex flex-row landscape:flex-col items-center justify-center gap-4 shrink-0 py-1 landscape:py-0 z-20">
                                    <button onClick={undo} className="w-14 h-14 landscape:w-16 landscape:h-16 glass-panel border-b-4 border-b-black/60 btn-3d rounded-full flex items-center justify-center text-white shadow-lg"><i className="fa-solid fa-rotate-left text-xl landscape:text-2xl"></i></button>
                                    <button onClick={() => { saveState(); setSwapped(prev => !prev); }} className="w-14 h-14 landscape:w-16 landscape:h-16 glass-panel border-b-4 border-b-black/60 btn-3d rounded-full flex items-center justify-center text-white shadow-lg"><i className="fa-solid fa-shuffle text-xl landscape:text-2xl"></i></button>
                                    <button onClick={changeServe} className="w-14 h-14 landscape:w-16 landscape:h-16 glass-panel border-b-4 border-b-black/60 btn-3d rounded-full flex items-center justify-center text-white shadow-lg"><i className="fa-solid fa-right-left text-xl landscape:text-2xl"></i></button>
                                    <button onClick={startTimeout} className="w-14 h-14 landscape:w-16 landscape:h-16 bg-gradient-to-br from-amber-500 to-orange-600 border-b-4 border-b-orange-900 btn-3d rounded-full flex items-center justify-center text-white shadow-[0_0_15px_rgba(245,158,11,0.4)]"><i className="fa-solid fa-stopwatch text-xl landscape:text-2xl"></i></button>
                                    <button onClick={() => setShowResetConfirm(true)} className="w-14 h-14 landscape:w-16 landscape:h-16 bg-black/80 border border-rose-500/50 border-b-4 border-b-black btn-3d rounded-full flex items-center justify-center text-rose-500 shadow-lg"><i className="fa-solid fa-power-off text-xl landscape:text-2xl"></i></button>
                                </div>

                                {/* JUGADOR 2 (CIAN NEÓN) */}
                                <div className={`flex-1 flex flex-col gap-3 min-h-0 min-w-0 ${swapped ? 'order-1' : 'order-3'}`}>
                                    
                                    {/* Nombre y Sets */}
                                    <div className="bg-gradient-to-r from-cyan-700 to-cyan-500 border-b-4 border-cyan-950 py-3 px-4 rounded-[20px] shadow-[0_0_20px_rgba(6,182,212,0.4)] flex items-center justify-between shrink-0">
                                        <div className="w-12 h-12 bg-black/50 border border-cyan-400/50 rounded-full flex items-center justify-center text-white font-digital font-bold text-2xl shadow-inner">{sets2}</div>
                                        <div className="flex flex-col items-center">
                                            <h2 className="text-white text-center font-black text-3xl landscape:text-4xl tracking-tighter uppercase leading-none drop-shadow-md">{p2}</h2>
                                            <div className="h-1.5 w-full flex justify-center gap-2 mt-2">
                                                {currentServer === 2 && Array.from({length: servesRemaining}).map((_, i) => (
                                                    <div key={i} className="h-1.5 w-8 bg-white rounded-full shadow-[0_0_8px_white] animate-pulse"></div>
                                                ))}
                                            </div>
                                        </div>
                                        <div className="w-10 md:w-14"></div>
                                    </div>

                                    {/* Marcador Principal */}
                                    <div onClick={() => addPoint(2)} className="flex-1 glass-panel border border-cyan-500/20 rounded-[30px] shadow-[inset_0_0_30px_rgba(6,182,212,0.15)] flex flex-col items-center justify-center relative active:scale-[0.98] transition-transform cursor-pointer overflow-hidden min-h-0">
                                        <div className="absolute top-4 right-6 text-cyan-400/60 font-digital text-[10px] uppercase tracking-widest">P2</div>
                                        <div className="text-white text-[25vh] landscape:text-[45vh] font-digital font-black leading-none tracking-tighter select-none neon-text-cyan">{score2}</div>
                                        <div className="absolute bottom-4 right-6 text-cyan-400/60 font-digital text-[10px] uppercase tracking-widest">T: {formatTime(matchTime)}</div>
                                    </div>
                                </div>
                            </div>

                            {/* OVERLAYS CON ESTILO GLASSMORPHISM */}
                            {isTimeoutActive && (
                                <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-[500] flex flex-col items-center justify-center p-10 text-white animate-in zoom-in">
                                    <i className="fa-solid fa-stopwatch text-6xl mb-6 text-orange-500 drop-shadow-[0_0_15px_rgba(249,115,22,0.8)] animate-pulse"></i>
                                    <h3 className="text-3xl font-black uppercase tracking-[0.3em] mb-4 text-orange-400">Tiempo Fuera</h3>
                                    <div className="text-[15vh] font-digital font-black leading-none tracking-tighter text-white drop-shadow-[0_0_20px_rgba(255,255,255,0.5)]">{formatTime(timeoutSeconds)}</div>
                                    <button onClick={() => setIsTimeoutActive(false)} className="mt-12 bg-white text-orange-600 px-16 py-6 border-b-4 border-b-zinc-400 btn-3d rounded-full font-black uppercase tracking-widest shadow-[0_0_30px_rgba(255,255,255,0.3)] text-xl">Reanudar</button>
                                </div>
                            )}

                            {showResetConfirm && (
                                <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-[500] flex flex-col items-center justify-center p-6 md:p-10 text-white animate-in zoom-in">
                                    <div className="glass-panel border-rose-500/50 p-10 rounded-3xl max-w-md w-full flex flex-col items-center shadow-[0_0_50px_rgba(225,29,72,0.3)]">
                                        <i className="fa-solid fa-triangle-exclamation text-6xl mb-6 text-rose-500 neon-text-red"></i>
                                        <h3 className="text-3xl font-black uppercase tracking-widest mb-4 text-center">¿Juego Nuevo?</h3>
                                        <p className="text-zinc-400 text-center mb-10">El marcador actual se borrará por completo.</p>
                                        <div className="flex flex-col md:flex-row gap-4 w-full">
                                            <button onClick={() => setShowResetConfirm(false)} className="flex-1 glass-panel border-b-4 border-b-black/50 text-white py-5 btn-3d rounded-2xl font-bold uppercase tracking-widest">Cancelar</button>
                                            <button onClick={resetMatch} className="flex-1 bg-gradient-to-r from-rose-700 to-rose-600 border-b-4 border-rose-900 text-white py-5 btn-3d rounded-2xl font-black uppercase tracking-widest shadow-[0_0_15px_rgba(225,29,72,0.5)]">Reiniciar</button>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {winner && (
                                <div className="fixed inset-0 bg-black/90 backdrop-blur-lg z-[600] flex flex-col items-center justify-center text-center p-6 md:p-10 animate-in zoom-in duration-500">
                                    <i className="fa-solid fa-trophy text-9xl text-yellow-400 mb-8 drop-shadow-[0_0_30px_rgba(250,204,21,0.6)]"></i>
                                    <p className="text-yellow-500 font-black uppercase tracking-[0.5em] text-[10px] md:text-xs mb-4">Ganador del Encuentro</p>
                                    <h2 className="text-[10vh] font-black text-white mb-16 uppercase italic tracking-tighter leading-none drop-shadow-[0_0_20px_rgba(255,255,255,0.5)]">{winner}</h2>
                                    <div className="flex flex-col landscape:flex-row w-full gap-4 max-w-lg">
                                        <button onClick={finalize} className="flex-1 bg-gradient-to-r from-emerald-500 to-emerald-400 border-b-4 border-emerald-800 text-white py-6 btn-3d rounded-3xl font-black uppercase tracking-widest shadow-[0_0_20px_rgba(16,185,129,0.5)]">Guardar Partido</button>
                                        <button onClick={undo} className="flex-1 glass-panel border-b-4 border-b-black/50 text-white py-6 btn-3d rounded-3xl font-bold uppercase tracking-widest text-xs">Error, Seguir Jugando</button>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
